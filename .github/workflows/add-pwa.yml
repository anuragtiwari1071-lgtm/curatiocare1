name: Add Curatio PWA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-pwa.yml'

permissions:
  contents: write

jobs:
  patch-pwa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch PWA into the existing app
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'CURATIO_PWA_V1'
          if marker in s:
              raise SystemExit('PWA patch already exists; stopping to prevent duplicate changes.')
          theme = '<meta name="theme-color" content="#0b5c68">'
          if s.count(theme) != 1 or s.count('</head>') != 1 or s.count('</body>') != 1:
              raise SystemExit('Unexpected index.html structure; no changes made.')

          s = s.replace(theme, theme + '\n<link rel="manifest" href="/manifest.webmanifest">\n<meta name="mobile-web-app-capable" content="yes">', 1)

          css = '''<!-- CURATIO_PWA_V1 -->
          <style id="curatio-pwa-style">
          #curatioInstallBanner{position:fixed;left:12px;right:12px;bottom:14px;z-index:120;background:#fff;border:1px solid #cfe8e4;border-radius:18px;padding:14px 15px;box-shadow:0 18px 50px rgba(16,47,59,.18);display:none;align-items:center;gap:12px}
          #curatioInstallBanner.show{display:flex}
          #curatioInstallBanner .pwa-icon{width:46px;height:46px;flex:0 0 46px;border-radius:13px;background:#e8f5f3;padding:6px}
          #curatioInstallBanner .pwa-copy{min-width:0;flex:1}
          #curatioInstallBanner .pwa-copy b{display:block;font-size:14px;color:#102f3b}
          #curatioInstallBanner .pwa-copy span{display:block;color:#647985;font-size:11px;line-height:1.45;margin-top:3px}
          #curatioInstallBanner .pwa-actions{display:flex;gap:7px;flex:0 0 auto}
          #curatioInstallBanner button{border-radius:10px;padding:9px 11px;font-size:12px;font-weight:800}
          #curatioInstallBanner .pwa-install{border:0;background:#0b5c68;color:#fff}
          #curatioInstallBanner .pwa-later{border:1px solid #dbe7e8;background:#fff;color:#102f3b}
          @media(max-width:520px){#curatioInstallBanner{align-items:flex-start}#curatioInstallBanner .pwa-actions{flex-direction:column}#curatioInstallBanner button{white-space:nowrap}}
          </style>'''
          s = s.replace('</head>', css + '\n</head>', 1)

          toast = '<div id="toast" class="toast"></div>'
          banner = '''<!-- CURATIO_PWA_V1 -->
          <div id="curatioInstallBanner" role="dialog" aria-label="Install Curatio.care">
            <img class="pwa-icon" src="/pwa-icon-192.svg" alt="">
            <div class="pwa-copy"><b>Install Curatio.care</b><span>Keep your bookings and reports one tap away on your phone.</span></div>
            <div class="pwa-actions"><button class="pwa-install" id="curatioInstallBtn" type="button">Install</button><button class="pwa-later" id="curatioInstallLater" type="button">Later</button></div>
          </div>'''
          if s.count(toast) != 1:
              raise SystemExit('Unexpected toast structure; no changes made.')
          s = s.replace(toast, toast + '\n' + banner, 1)

          js = '''<!-- CURATIO_PWA_V1 -->
          <script>
          (function(){
            var deferredPrompt=null;
            var banner=document.getElementById('curatioInstallBanner');
            var installBtn=document.getElementById('curatioInstallBtn');
            var laterBtn=document.getElementById('curatioInstallLater');
            var DISMISS_KEY='curatio_pwa_install_dismissed_v1';
            function standalone(){return (window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||window.navigator.standalone===true;}
            function hide(){if(banner) banner.classList.remove('show');}
            function show(){if(!banner||standalone()||localStorage.getItem(DISMISS_KEY)==='1')return;banner.classList.add('show');}
            window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredPrompt=e;show();});
            if(installBtn)installBtn.addEventListener('click',async function(){if(!deferredPrompt){hide();return;}var e=deferredPrompt;deferredPrompt=null;hide();try{await e.prompt();await e.userChoice;}catch(_){} });
            if(laterBtn)laterBtn.addEventListener('click',function(){localStorage.setItem(DISMISS_KEY,'1');hide();});
            window.addEventListener('appinstalled',function(){deferredPrompt=null;hide();});
            window.addEventListener('pageshow',function(){if(standalone())hide();});
          })();
          </script>'''
          s = s.replace('</body>', js + '\n</body>', 1)
          p.write_text(s, encoding='utf-8')

          manifest = {
            'id':'/', 'name':'Curatio.care', 'short_name':'Curatio',
            'description':'Curatio.care diagnostic test booking and home sample collection service.',
            'start_url':'/', 'scope':'/', 'display':'standalone',
            'display_override':['window-controls-overlay','standalone'],
            'background_color':'#f7faf9', 'theme_color':'#0b5c68',
            'lang':'en-IN', 'dir':'ltr', 'prefer_related_applications':False,
            'icons':[
              {'src':'/pwa-icon-192.svg','sizes':'192x192','type':'image/svg+xml','purpose':'any maskable'},
              {'src':'/pwa-icon-512.svg','sizes':'512x512','type':'image/svg+xml','purpose':'any maskable'}
            ]
          }
          Path('manifest.webmanifest').write_text(json.dumps(manifest,indent=2)+'\n',encoding='utf-8')
          svg='''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#0b5c68"/><circle cx="256" cy="256" r="184" fill="#e8f5f3"/><path d="M256 365c-8-7-104-79-104-143 0-47 38-82 83-82 29 0 51 14 65 35 14-21 36-35 65-35 45 0 83 35 83 82 0 64-96 136-104 143-11 9-25 9-36 0Z" fill="#0d7882"/><path d="M256 337c-29-24-73-64-73-108 0-24 18-43 42-43 19 0 31 10 39 26 8-16 20-26 39-26 24 0 42 19 42 43 0 44-44 84-73 108-5 4-11 4-16 0Z" fill="#fff"/><path d="M256 170v96M208 218h96" stroke="#0b5c68" stroke-width="20" stroke-linecap="round"/><text x="256" y="430" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="800" fill="#fff">Curatio</text></svg>'''
          Path('pwa-icon-192.svg').write_text(svg,encoding='utf-8')
          Path('pwa-icon-512.svg').write_text(svg,encoding='utf-8')
          PY

      - name: Verify and commit only PWA additions
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f manifest.webmanifest
          test -f pwa-icon-192.svg
          test -f pwa-icon-512.svg
          grep -q 'CURATIO_PWA_V1' index.html
          grep -q 'manifest.webmanifest' index.html
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html manifest.webmanifest pwa-icon-192.svg pwa-icon-512.svg
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'Add Curatio PWA install experience'
          git push

      - name: Remove this one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/add-pwa.yml
          git commit -m 'Remove one-time PWA patch workflow'
          git push

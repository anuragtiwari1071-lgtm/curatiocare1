name: Add Curatio visual polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-visual-polish.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add visual layer without changing application logic
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'CURATIO_VISUAL_POLISH_V1'
          if marker in s:
              raise SystemExit('Visual polish already exists; stopping to prevent duplicate changes.')
          if s.count('</head>') != 1 or s.count('</body>') != 1:
              raise SystemExit('Unexpected index.html structure; no changes made.')
          css = r'''
          <!-- CURATIO_VISUAL_POLISH_V1 -->
          <style id="curatio-visual-polish-v1">
          :root{
            --curatio-ink:#0d2b36;
            --curatio-brand:#087884;
            --curatio-brand-deep:#07535e;
            --curatio-aqua:#14a3a0;
            --curatio-mint:#eaf8f6;
            --curatio-soft:#f4fbfa;
            --curatio-line:#d7e9e7;
            --curatio-shadow:0 18px 55px rgba(9,67,77,.10);
            --curatio-shadow-hover:0 22px 65px rgba(9,67,77,.15);
          }
          html{scroll-behavior:smooth}
          body{
            background:
              radial-gradient(circle at 7% 9%,rgba(20,163,160,.075),transparent 24rem),
              radial-gradient(circle at 94% 19%,rgba(8,120,132,.055),transparent 25rem),
              linear-gradient(180deg,#fbfefd 0%,#f5faf9 100%);
            color:var(--curatio-ink);
          }
          body:before{
            content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.34;
            background-image:radial-gradient(rgba(8,120,132,.11) .7px,transparent .7px);
            background-size:20px 20px;
            mask-image:linear-gradient(to bottom,black,transparent 72%);
          }
          .topbar{
            height:78px;
            background:rgba(255,255,255,.88);
            box-shadow:0 8px 28px rgba(16,47,59,.055);
            border-bottom:1px solid rgba(215,233,231,.9);
          }
          .brand{gap:11px}
          .brand img{width:46px;height:46px;border-radius:14px;box-shadow:0 6px 18px rgba(8,120,132,.16);transition:transform .25s ease,box-shadow .25s ease}
          .brand:hover img{transform:translateY(-1px) rotate(-1deg);box-shadow:0 9px 22px rgba(8,120,132,.22)}
          .brand b{font-weight:800;letter-spacing:-.02em}
          .brand span{letter-spacing:.015em}
          .lang,.admin-link{
            border-color:var(--curatio-line);box-shadow:0 4px 14px rgba(16,47,59,.035);transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;
          }
          .lang:hover,.admin-link:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(16,47,59,.08);border-color:#b8d9d5}
          main{padding-top:28px}
          .hero{position:relative;padding:52px 0 38px}
          .hero:before{
            content:"";position:absolute;right:4%;top:12%;width:180px;height:180px;border-radius:50%;
            border:1px solid rgba(20,163,160,.14);box-shadow:0 0 0 28px rgba(20,163,160,.035),0 0 0 58px rgba(20,163,160,.018);pointer-events:none;
          }
          .eyebrow{display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border-radius:999px;background:rgba(234,248,246,.82);border:1px solid #cfeae6;box-shadow:0 5px 16px rgba(8,120,132,.05)}
          .eyebrow:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--curatio-aqua);box-shadow:0 0 0 4px rgba(20,163,160,.10)}
          h1{color:var(--curatio-ink);text-wrap:balance}
          .hero p:not(.eyebrow){font-size:17px;max-width:680px}
          .hero-card{
            position:relative;overflow:hidden;
            background:linear-gradient(145deg,#07535e 0%,#087884 52%,#12a09b 100%);
            border:1px solid rgba(255,255,255,.20);
            box-shadow:0 24px 60px rgba(5,83,94,.23);
          }
          .hero-card:before,.hero-card:after{content:"";position:absolute;border-radius:50%;pointer-events:none}
          .hero-card:before{width:210px;height:210px;right:-92px;top:-86px;border:1px solid rgba(255,255,255,.18);box-shadow:0 0 0 26px rgba(255,255,255,.035),0 0 0 52px rgba(255,255,255,.025)}
          .hero-card:after{width:90px;height:90px;left:-38px;bottom:-42px;background:rgba(255,255,255,.06)}
          .hero-card>*{position:relative;z-index:1}
          .hero-card strong{letter-spacing:-.03em}
          .primary{background:linear-gradient(135deg,#087884,#0b9290);border:1px solid rgba(255,255,255,.08);box-shadow:0 11px 24px rgba(8,120,132,.22);transition:transform .2s ease,box-shadow .2s ease,filter .2s ease}
          .primary:hover{background:linear-gradient(135deg,#075f69,#087c7a);transform:translateY(-2px);box-shadow:0 15px 30px rgba(8,120,132,.27);filter:saturate(1.05)}
          .primary:active,.secondary:active,.quick-grid button:active{transform:translateY(1px)}
          .secondary{transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;background:rgba(255,255,255,.92)}
          .secondary:hover{transform:translateY(-1px);box-shadow:0 9px 22px rgba(16,47,59,.08);border-color:#b8d9d5}
          .quick-grid{gap:14px;margin-top:18px}
          .quick-grid button{
            position:relative;overflow:hidden;border-color:var(--curatio-line);background:rgba(255,255,255,.9);box-shadow:0 9px 28px rgba(16,47,59,.045);transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;
          }
          .quick-grid button:before{content:"";position:absolute;left:0;top:0;width:100%;height:3px;background:linear-gradient(90deg,#087884,#14a3a0);transform:scaleX(.2);transform-origin:left;transition:transform .25s ease}
          .quick-grid button:hover{transform:translateY(-4px);box-shadow:var(--curatio-shadow-hover);border-color:#bfdfdc}
          .quick-grid button:hover:before{transform:scaleX(1)}
          .quick-grid span{width:46px;height:46px;display:grid;place-items:center;border-radius:14px;background:var(--curatio-mint);border:1px solid #d1ece8;box-shadow:inset 0 0 0 5px rgba(255,255,255,.5);transition:transform .2s ease}
          .quick-grid button:hover span{transform:scale(1.05) rotate(-2deg)}
          .info-card{box-shadow:0 9px 28px rgba(8,120,132,.055);border-color:#cce7e3}
          .section-head{margin-top:28px}
          .section-head h2{letter-spacing:-.035em}
          .back{box-shadow:0 5px 16px rgba(16,47,59,.05);transition:transform .2s ease,box-shadow .2s ease}
          .back:hover{transform:translateX(-2px);box-shadow:0 9px 20px rgba(16,47,59,.08)}
          .search{box-shadow:0 6px 20px rgba(16,47,59,.035);transition:box-shadow .2s ease,border-color .2s ease}
          .search:focus{box-shadow:0 0 0 4px rgba(20,163,160,.09),0 8px 22px rgba(16,47,59,.06)}
          .test-list{gap:16px}
          .test-card,.card{
            border-color:var(--curatio-line);box-shadow:0 8px 26px rgba(16,47,59,.045);transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;
          }
          .test-card:hover,.card:hover{transform:translateY(-3px);box-shadow:var(--curatio-shadow);border-color:#bfdfdc}
          .test-card.selected{border-color:#12a09b;box-shadow:0 0 0 3px rgba(20,163,160,.10),0 15px 34px rgba(16,47,59,.08)}
          .price{font-size:17px;color:#087884}
          .selected-test{box-shadow:0 9px 24px rgba(8,120,132,.06)}
          .form{border-color:var(--curatio-line);box-shadow:var(--curatio-shadow)}
          input,textarea,select{transition:border-color .2s ease,box-shadow .2s ease,transform .2s ease}
          input:focus,textarea:focus,select:focus{transform:translateY(-1px);border-color:#14a3a0;box-shadow:0 0 0 4px rgba(20,163,160,.09),0 9px 22px rgba(16,47,59,.05)}
          .location-btn{transition:background .2s ease,border-color .2s ease,transform .2s ease}
          .location-btn:hover{background:#edf9f7;border-color:#70b9b4;transform:translateY(-1px)}
          .payment-box{box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}
          .success{padding:14px 0}
          .success-icon{box-shadow:0 0 0 10px rgba(20,163,160,.06),0 12px 30px rgba(8,120,132,.10);animation:curatio-pop .5s ease both}
          .summary{box-shadow:0 12px 32px rgba(16,47,59,.055);border-color:var(--curatio-line)}
          .badge{border:1px solid #cfeae6}
          footer{background:rgba(255,255,255,.52)}
          .toast{border:1px solid rgba(255,255,255,.12);box-shadow:0 18px 45px rgba(8,47,55,.25)}
          .admin-login,.admin-card,.stat,.stat-card{border-color:var(--curatio-line);box-shadow:0 10px 30px rgba(16,47,59,.055)}
          .admin-card:hover,.stat:hover,.stat-card:hover{box-shadow:var(--curatio-shadow);border-color:#bfdfdc}
          .admin-tabs{border-color:var(--curatio-line)}
          .tab{transition:color .2s ease,background .2s ease}
          .tab:hover{background:#f1f9f8;color:var(--curatio-brand)}
          .admin-table th{background:#eff8f7;color:#315b62}
          .status-pill{border:1px solid rgba(13,89,98,.08)}
          .modal{backdrop-filter:blur(5px)}
          .modal-card{box-shadow:0 28px 90px rgba(8,31,38,.22);border:1px solid rgba(215,233,231,.9)}
          .modal-close{transition:transform .2s ease,background .2s ease}
          .modal-close:hover{transform:rotate(4deg);background:#eaf8f6}
          .booking-detail-card .detail-item{transition:transform .18s ease,box-shadow .18s ease}
          .booking-detail-card .detail-item:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(16,47,59,.05)}
          #curatioInstallBanner{box-shadow:0 22px 60px rgba(8,47,55,.22);backdrop-filter:blur(12px);background:rgba(255,255,255,.96);border-color:#c4e5e1}
          #curatioInstallBanner .pwa-install{background:linear-gradient(135deg,#087884,#12a09b);box-shadow:0 7px 17px rgba(8,120,132,.18);transition:transform .2s ease,box-shadow .2s ease}
          #curatioInstallBanner .pwa-install:hover{transform:translateY(-1px);box-shadow:0 10px 22px rgba(8,120,132,.24)}
          #curatioInstallBanner .pwa-later{transition:background .2s ease,border-color .2s ease}
          #curatioInstallBanner .pwa-later:hover{background:#f4fbfa;border-color:#b8d9d5}
          @keyframes curatio-pop{0%{transform:scale(.82);opacity:0}70%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
          @media(max-width:760px){
            .topbar{height:70px}
            main{padding-left:14px;padding-right:14px}
            .hero{padding:34px 0 28px}
            .hero:before{width:120px;height:120px;right:-20px;top:8%;box-shadow:0 0 0 18px rgba(20,163,160,.035),0 0 0 38px rgba(20,163,160,.018)}
            .hero p:not(.eyebrow){font-size:15px}
            .quick-grid button{padding:18px}
          }
          @media(prefers-reduced-motion:reduce){
            html{scroll-behavior:auto}
            *,*:before,*:after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
          }
          </style>
          '''
          s = s.replace('</head>', css + '</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          grep -q 'CURATIO_VISUAL_POLISH_V1' index.html
          grep -q 'CURATIO_PWA_V1' index.html
          grep -q 'manifest.webmanifest' index.html
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'Polish Curatio visual design'
          git push

      - name: Remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/add-visual-polish.yml
          git commit -m 'Remove one-time visual polish workflow'
          git push

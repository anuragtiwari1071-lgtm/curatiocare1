name: Apply Curatio visual polish

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-visual-polish.yml'
      - 'curatio-visual.css'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach visual stylesheet without touching app logic
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='CURATIO_VISUAL_LINK_V1'
          if marker in s:
              raise SystemExit('Visual link already present; stopping safely.')
          if s.count('</head>') != 1:
              raise SystemExit('Unexpected HTML structure; no changes made.')
          link='<!-- CURATIO_VISUAL_LINK_V1 --><link rel="stylesheet" href="/curatio-visual.css">'
          s=s.replace('</head>',link+'\n</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
          test -f index.html
          test -f curatio-visual.css
          grep -q 'CURATIO_VISUAL_LINK_V1' index.html
          grep -q 'CURATIO_PWA_V1' index.html
          grep -q 'manifest.webmanifest' index.html
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --check
          git commit -m 'Attach Curatio visual design layer'
          git push
      - name: Remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/add-visual-polish.yml
          git commit -m 'Remove one-time visual polish workflow'
          git push
